# Sobe a API + RabbitMQ. Antes: cp .env.example .env
#   docker compose up -d --build
#   Swagger:      http://localhost:6006/swagger
#   RabbitMQ UI:  http://localhost:15672  (messaging / valor de RabbitMQ__pass)
services:
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: messaging-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: messaging
      RABBITMQ_DEFAULT_PASS: ${RabbitMQ__pass:-messaging123}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      start_period: 20s
      retries: 10
    restart: unless-stopped

  messaging-api:
    build: .
    image: messaging-api:local
    container_name: messaging-api
    ports:
      - "6006:6006"
    env_file:
      - .env
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - outbox-data:/app/data
    healthcheck:
      test:
        ['CMD-SHELL', 'curl -fsS "http://127.0.0.1:$${HEALTH_PORT:-6006}/api/health/ready" || exit 1']
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

volumes:
  outbox-data:
  rabbitmq-data:
